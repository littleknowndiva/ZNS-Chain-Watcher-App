/**
 * Wraps Firebase Realtime Database so the rest of this file can keep using
 * the exact same doc()/collection() shape it always has (.get/.set/.delete/
 * .onSnapshot, docChanges(), {exists, data()}). Nothing below this function
 * needed to change when we swapped backends — only this adapter did.
 */
function makeRealtimeDbShim(rtdb) {
  function docHandle(path) {
    const ref = rtdb.ref(path);
    return {
      get: async () => {
        const snap = await ref.once('value');
        return { exists: snap.exists(), data: () => snap.val() };
      },
      set: async (data) => { await ref.set(data); return null; },
      delete: async () => { await ref.remove(); return null; },
      onSnapshot: (cb, errCb) => {
        const handler = (snap) => cb({ exists: snap.exists(), data: () => snap.val() });
        ref.on('value', handler, errCb || (() => {}));
        return () => ref.off('value', handler);
      }
    };
  }

  function collectionHandle(name) {
    const ref = rtdb.ref(name);
    return {
      doc: (id) => docHandle(`${name}/${id}`),
      get: async () => {
        const snap = await ref.once('value');
        const val = snap.val() || {};
        const docs = Object.entries(val).map(([id, data]) => ({ id, data: () => data }));
        return { empty: docs.length === 0, docs };
      },
      onSnapshot: (cb, errCb) => {
        let prevKeys = new Set();
        const handler = (snap) => {
          const val = snap.val() || {};
          const currentKeys = new Set(Object.keys(val));
          const changes = [];
          currentKeys.forEach(id => {
            changes.push({ type: prevKeys.has(id) ? 'modified' : 'added', doc: { id, data: () => val[id] } });
          });
          prevKeys.forEach(id => {
            if (!currentKeys.has(id)) changes.push({ type: 'removed', doc: { id, data: () => null } });
          });
          prevKeys = currentKeys;
          cb({ docChanges: () => changes });
        };
        ref.on('value', handler, errCb || (() => {}));
        return () => ref.off('value', handler);
      }
    };
  }

  return {
    doc: (path) => docHandle(path),
    collection: (name) => collectionHandle(name)
  };
}

// Helper to format Date object as YYYY-MM-DD in UTC
const formatDateToISO = (date) => {
  return date.toISOString().split('T')[0];
};

// Helper to shift ISO date string by N days
const shiftDateString = (dateStr, days) => {
  const [y, m, d] = dateStr.split('-').map(Number);
  const dt = new Date(Date.UTC(y, m - 1, d));
  dt.setUTCDate(dt.getUTCDate() + days);
  return formatDateToISO(dt);
};

const generateInitialShiftsForDate = (dateStr, isPastDay = false) => {
  // Clean slate: every hour starts unassigned. Real members sign up
  // directly in the roster — no demo/placeholder watchers.
  const shifts = [];
  for (let hour = 0; hour < 24; hour++) {
    shifts.push({
      hour, // 0 to 23 TCT
      primaryWatcher: null,
      secondaryWatcher: null,
      primaryCompleted: false,
      secondaryCompleted: false,
      forceLocked: false,
      passedOverride: false,
      notes: ''
    });
  }
  return shifts;
};

  const [syncStatus, setSyncStatus] = useState('connecting'); // 'connecting' | 'live' | 'local'
  const [isAdmin, setIsAdmin] = useState(false); // true if the signed-in Firebase user's uid is in /admins

  const [showGoalPrompt, setShowGoalPrompt] = useState(false);
  const [goalPromptDismissed, setGoalPromptDismissed] = useState(false);
  const [resetStatus, setResetStatus] = useState(null); // { type: 'ok'|'err', message }

  // Published pages run in a sandboxed iframe where window.confirm/alert/prompt
  // are blocked and silently return false — no dialog, no error, just nothing
  // happens. This is a real in-app replacement that actually works.
  const [confirmState, setConfirmState] = useState(null); // { message, resolve }
  const askConfirm = (message) => new Promise((resolve) => setConfirmState({ message, resolve }));
  const resolveConfirm = (result) => {
    if (confirmState) confirmState.resolve(result);
    setConfirmState(null);
  };

  const updateSettings = (patch) => {
    setSettings(prev => {
      const next = { ...prev, ...patch };
      if (dbRef.current) {
        dbRef.current.doc('config/settings').set(next).catch(() => {});
      }
      return next;
    });
  };

  useEffect(() => {
    let unsubSettings = null, unsubChainSync = null, unsubRosterNames = null, unsubShifts = null, unsubArchive = null;
    let cancelled = false;

    (async () => {
      let db = null;
      try {
        if (typeof firebase === 'undefined') throw new Error('Firebase SDK not loaded');
        if (!firebase.apps.length) firebase.initializeApp(FIREBASE_CONFIG);

      // Seed + subscribe: open "shifts" collection (current & future days)
      try {
        const qs = await db.collection('shifts').get();
        if (qs.empty) {
          const entries = Object.entries(shiftsByDate);
          for (const [dateStr, shifts] of entries) {

        } else {
          const loaded = {};
          qs.docs.forEach(d => { loaded[d.id] = d.data().shifts; });

          // Sweep any day that has already passed into the admin-only archive,

          for (const d of qs.docs) {

      unsubShifts = db.collection('shifts').onSnapshot((qsnap) => {
        setShiftsByDate(prev => {
          const next = { ...prev };

            if (ch.type === 'removed') delete next[ch.doc.id];

            else next[ch.doc.id] = ch.doc.data().shifts;
          });
          return next;
        });
      }, () => {});

      if (!cancelled) setSyncStatus('live');
    })();

    return () => {
      cancelled = true;
      if (unsubSettings) unsubSettings();
      if (unsubChainSync) unsubChainSync();
      if (unsubRosterNames) unsubRosterNames();
      if (unsubShifts) unsubShifts();
      if (unsubArchive) unsubArchive();
    };
    // eslint-disable-next-line
  }, []);

  // Officer authentication (Firebase Auth) — replaces Claude's user.canEdit().
  // Regular members never need to sign in at all; this only matters for
  // whoever needs Roster Settings / retroactive edit access.
  useEffect(() => {
    if (typeof firebase === 'undefined' || !firebase.auth) return;
    const unsub = firebase.auth().onAuthStateChanged(async (user) => {
      setAuthUser(user);
      if (user && dbRef.current) {
        try {
          const snap = await dbRef.current.doc(`admins/${user.uid}`).get();
          setIsAdmin(snap.exists && snap.data() === true);
        } catch (e) {
          setIsAdmin(false);
        }
      } else {
        setIsAdmin(false);
      }
    });
    return () => unsub();
  }, []);

  const handleOfficerLogin = async () => {
    setLoginError('');
    if (!loginEmail.trim() || !loginPassword) {
      setLoginError('Enter both an email and a password.');
      return;
    }
    setLoginBusy(true);
    try {
      await firebase.auth().signInWithEmailAndPassword(loginEmail.trim(), loginPassword);
      setShowLoginModal(false);
      setLoginEmail('');
      setLoginPassword('');
    } catch (e) {
      setLoginError(e.message || 'Login failed.');
    } finally {
      setLoginBusy(false);
    }
  };

  const handleOfficerLogout = async () => {
    try { await firebase.auth().signOut(); } catch (e) {}
  };

  // If access changes (or resolves after the initial render) and a non-admin
  // is sitting on the admin-only Settings tab, bounce them back to the roster.
  useEffect(() => {
    if (!isAdmin && activeTab === 'settings') setActiveTab('schedule');
  }, [isAdmin, activeTab]);

  // Calculate Chain Start Time and Live Countdown
  const chainStartTime = useMemo(() => {
    if (!settings.chainStartDate) return null;
    const [y, m, d] = settings.chainStartDate.split('-').map(Number);
    return new Date(Date.UTC(y, m - 1, d, settings.chainStartHour || 0, 0, 0));
  }, [settings.chainStartDate, settings.chainStartHour]);

  const timeUntilStart = useMemo(() => {
    if (!chainStartTime) return null;
    const diff = chainStartTime.getTime() - currentTime.getTime();
    if (diff <= 0) return null;

    const seconds = Math.floor((diff / 1000) % 60);
    const minutes = Math.floor((diff / (1000 * 60)) % 60);
    const hours = Math.floor((diff / (1000 * 60 * 60)) % 24);
    const days = Math.floor(diff / (1000 * 60 * 60 * 24));

    return { days, hours, minutes, seconds, totalMs: diff };
  }, [chainStartTime, currentTime]);

  // Selected Roster Date State for Day Navigation
  const [selectedDate, setSelectedDate] = useState(defaultStartDate);

  // Multi-day Shifts State: { [dateStr]: [24 shift objects] }
  const [shiftsByDate, setShiftsByDate] = useState(() => {
    const dayMinus2 = shiftDateString(defaultStartDate, -2);
    const dayMinus1 = shiftDateString(defaultStartDate, -1);
    const day0 = defaultStartDate;
    const day1 = shiftDateString(defaultStartDate, 1);

    return {
      [dayMinus2]: generateInitialShiftsForDate(dayMinus2, true),
      [dayMinus1]: generateInitialShiftsForDate(dayMinus1, true),
      [day0]: generateInitialShiftsForDate(day0, false),
      [day1]: generateInitialShiftsForDate(day1, false),
    };
  });

  // Chain hit data, synced from Torn's own API via copy/paste (see the Chain
  // Sync tab) — this page can't fetch api.torn.com directly (hosted pages
  // can't make outbound requests to outside sites), so a member opens the
  // Torn API URL in their own tab, copies the JSON, and pastes it here.
  const [chainSync, setChainSync] = useState({
    attackers: [],       // [{ id, hits, respect, bonusHits }]
    nonAttackerIds: [],  // [id, ...] — zero hits this chain
    chainLength: 0,
    chainStart: null,
    chainEnd: null,
    updatedAt: null,
    syncedBy: null
  });
  const [rosterNames, setRosterNames] = useState({}); // { "<torn_id>": "Name" }

  const [apiKey, setApiKey] = useState(() => localStorage.getItem('zoo_torn_api_key') || '');
  const [rosterPasteText, setRosterPasteText] = useState('');
  const [chainPasteText, setChainPasteText] = useState('');
  const [syncerName, setSyncerName] = useState(() => localStorage.getItem('zoo_syncer_name') || '');
  const [rosterSyncMsg, setRosterSyncMsg] = useState(null); // { type: 'ok'|'error', text }
  const [chainSyncMsg, setChainSyncMsg] = useState(null);

  // Get or initialize shifts for a specific date
  const currentDayShifts = useMemo(() => {
    if (shiftsByDate[selectedDate]) {
      return shiftsByDate[selectedDate];
    }
    return generateInitialShiftsForDate(selectedDate, selectedDate < formatDateToISO(new Date()));
  }, [shiftsByDate, selectedDate]);

  // Helper to safely update shifts for currently selected date
  const updateCurrentDayShifts = (updaterFn) => {
    setShiftsByDate(prev => {
      const existing = prev[selectedDate] || generateInitialShiftsForDate(selectedDate, selectedDate < formatDateToISO(new Date()));
      const updated = updaterFn(existing);
      if (dbRef.current) {
        // Past days live in the admin-only archive; the server itself rejects
        // this write for anyone without "Can edit" access — the lock UI just
        // mirrors that so people aren't surprised by a silent failure.
        const targetCollection = selectedDate < todayDateStr ? 'shifts_archive' : 'shifts';
        dbRef.current.collection(targetCollection).doc(selectedDate).set({ shifts: updated }).catch(() => {});
      }
      return { ...prev, [selectedDate]: updated };
    });
  };

  const getShiftLockStatus = (hour, isForceLocked, isPassedOverride) => {
    // The manual padlock is absolute: once a leader switches it on, the names
    // are locked for everyone — leaders included — until it's switched off
    // again. It intentionally comes before everything else, admins included.
    if (isForceLocked) return { isLocked: true, reason: 'MANUAL_LOCK', label: 'Locked (Padlock On)' };

    // An hour that has already passed today locks itself automatically —
    // for everyone, officers included — unless an officer has specifically
    // switched the padlock to override just this passed hour.
    if (settings.autoLockPassedHours && selectedDate === todayDateStr && hour < currentTCTHour) {
      if (isPassedOverride) return { isLocked: false, reason: null };
      return { isLocked: true, reason: 'PASSED', label: 'Expired / Passed' };
    }

    // Higher-ranked members ("Can edit" access) can retroactively change any
    // other rostered watcher — past days included — everyone else follows
    // the normal lock rules below.
    if (isAdmin) return { isLocked: false, reason: null };
    if (settings.chainStatus === 'paused') return { isLocked: true, reason: 'PAUSED', label: 'Chain Paused' };
    if (settings.chainStatus === 'completed') return { isLocked: true, reason: 'CHAIN_ENDED', label: 'Chain Ended' };
    
    // Check if the selected date is in the past
    if (selectedDate < todayDateStr) {
      return { isLocked: true, reason: 'PAST_DATE', label: 'Past Day Archived' };
    }

    return { isLocked: false, reason: null };
  };

  const handleNameChange = (hour, role, name) => {
    const shift = currentDayShifts.find(s => s.hour === hour);
    const { isLocked } = getShiftLockStatus(hour, shift?.forceLocked, shift?.passedOverride);
    if (isLocked) return;

    updateCurrentDayShifts(prev => prev.map(s => {
      if (s.hour === hour) {
        return role === 'primary' 
          ? { ...s, primaryWatcher: name, primaryCompleted: name ? s.primaryCompleted : false } 
          : { ...s, secondaryWatcher: name, secondaryCompleted: name ? s.secondaryCompleted : false };
      }
      return s;
    }));
  };

  const handleNoteChange = (hour, note) => {
    const shift = currentDayShifts.find(s => s.hour === hour);
    const { isLocked } = getShiftLockStatus(hour, shift?.forceLocked, shift?.passedOverride);
    if (isLocked) return;

    updateCurrentDayShifts(prev => prev.map(s => (
      s.hour === hour ? { ...s, notes: note } : s
    )));
  };

  const toggleCompletion = (hour, role) => {
    const shift = currentDayShifts.find(s => s.hour === hour);
    const { isLocked } = getShiftLockStatus(hour, shift?.forceLocked, shift?.passedOverride);
    if (isLocked) return;

    updateCurrentDayShifts(prev => prev.map(s => {
      if (s.hour === hour) {
        return role === 'primary' 
          ? { ...s, primaryCompleted: !s.primaryCompleted } 
          : { ...s, secondaryCompleted: !s.secondaryCompleted };
      }
      return s;
    }));
  };

  const validateShiftsByDate = (data) => {
    if (typeof data !== 'object' || data === null || Array.isArray(data)) {
      throw new Error('Top level must be an object keyed by date (YYYY-MM-DD).');
    }
    for (const [dateStr, shifts] of Object.entries(data)) {
      if (!/^\d{4}-\d{2}-\d{2}$/.test(dateStr)) {
        throw new Error(`"${dateStr}" is not a YYYY-MM-DD date key.`);
      }
      if (!Array.isArray(shifts) || shifts.length !== 24) {
        throw new Error(`${dateStr}: expected an array of 24 shift objects, got ${Array.isArray(shifts) ? shifts.length : typeof shifts}.`);
      }
      shifts.forEach((s, i) => {
        if (typeof s !== 'object' || s === null) throw new Error(`${dateStr} hour ${i}: not an object.`);
        if (s.hour !== i) throw new Error(`${dateStr} hour ${i}: shift.hour is ${s.hour}, expected ${i}.`);
        if (!('primaryWatcher' in s) || !('secondaryWatcher' in s)) throw new Error(`${dateStr} hour ${i}: missing primaryWatcher/secondaryWatcher.`);
      });
    }
  };

  const handleImportShiftData = async () => {
    setImportStatus(null);
    let data;
    try {
      data = JSON.parse(importText);
      validateShiftsByDate(data);
    } catch (e) {
      setImportStatus({ type: 'err', message: 'Invalid data: ' + e.message });
      return;
    }

    const dateCount = Object.keys(data).length;
    const allSlots = Object.values(data).flat();
    const slotCount = allSlots.length;
    const filledCount = allSlots.filter(s => s.primaryWatcher || s.secondaryWatcher).length;

    const ok = await askConfirm(
      `Import ${dateCount} date(s), ${slotCount} shift slots (${filledCount} with a watcher assigned)?\n\n` +
      `This writes directly into the shared schedule everyone sees — existing shifts on these ` +
      `same dates/hours will be OVERWRITTEN, not merged with what's already there. Continue?`
    );
    if (!ok) return;

    if (!dbRef.current) {
      setImportStatus({ type: 'err', message: 'Import failed: not connected to shared sync right now — try reloading the page.' });
      return;
    }

    try {
      setImportStatus({ type: 'info', message: 'Importing...' });
      for (const [dateStr, shifts] of Object.entries(data)) {
        const targetCollection = dateStr < todayDateStr ? 'shifts_archive' : 'shifts';
        await dbRef.current.collection(targetCollection).doc(dateStr).set({ shifts });
      }
      setShiftsByDate(prev => ({ ...prev, ...data }));
      setImportStatus({ type: 'ok', message: `Imported ${dateCount} date(s), ${filledCount} filled slot(s).` });
      setImportText('');
    } catch (e) {
      setImportStatus({ type: 'err', message: 'Import failed: ' + e.message });
    }
  };

  const toggleManualLockHour = (hour) => {
    if (!isAdmin) return; // only members with edit access can lock/unlock a shift
    updateCurrentDayShifts(prev => prev.map(s => {
      if (s.hour !== hour) return s;

      const isAutoPassedLocked = settings.autoLockPassedHours && selectedDate === todayDateStr && hour < currentTCTHour;

      // If this hour is only locked because it's already passed (not a manual
      // lock), the padlock's job here is to toggle the officer override for
      // just that passed-hour lock, rather than setting the absolute lock.
      if (isAutoPassedLocked && !s.forceLocked) {
        return { ...s, passedOverride: !s.passedOverride };
      }

      // Otherwise it's the normal absolute manual lock toggle.
      return { ...s, forceLocked: !s.forceLocked, passedOverride: false };
    }));
  };

  const handleSaveApiKey = (key) => {
    setApiKey(key);
    localStorage.setItem('zoo_torn_api_key', key);
  };

  const handleSaveSyncerName = (name) => {
    setSyncerName(name);
    localStorage.setItem('zoo_syncer_name', name);
  };

  // Parses a pasted `GET /faction/{id}?selections=basic&key=...` response
  // (the "members" object) into an id -> name map, and shares it.
  const syncRosterNames = () => {
    try {
      const parsed = JSON.parse(rosterPasteText);
      if (parsed.error) throw new Error(`Torn API error ${parsed.error.code}: ${parsed.error.error}`);
      if (!parsed.members || typeof parsed.members !== 'object') {
        throw new Error('That doesn\'t look like a faction roster response — expected a "members" object.');
      }
      const idToName = {};
      Object.entries(parsed.members).forEach(([id, m]) => { idToName[id] = m.name; });

      setRosterNames(idToName);
      if (dbRef.current) {
        dbRef.current.doc('config/rosterNames').set({ idToName, updatedAt: Date.now() }).catch(() => {});
      }
      setRosterSyncMsg({ type: 'ok', text: `Synced ${Object.keys(idToName).length} member names.` });
      setRosterPasteText('');
    } catch (e) {
      setRosterSyncMsg({ type: 'error', text: e.message || 'Could not parse that as JSON.' });
    }
  };

  // Parses a pasted `GET /v2/faction/chainreport?key=...` response into the
  // shared chain-hit totals every member's page reads from.
  const syncChainReport = () => {
    try {
      const parsed = JSON.parse(chainPasteText);
      if (parsed.error) throw new Error(`Torn API error ${parsed.error.code}: ${parsed.error.error}`);
      const report = parsed.chainreport;
      if (!report) throw new Error('That doesn\'t look like a chain report response — expected a "chainreport" object.');

      const attackers = (report.attackers || []).map(a => ({
        id: a.id,
        hits: (a.attacks && a.attacks.total) || 0,
        respect: (a.respect && a.respect.total) || 0,
        bonusHits: (a.attacks && a.attacks.bonuses) || 0
      }));
      const nonAttackerIds = report.non_attackers || [];

      const next = {
        attackers,
        nonAttackerIds,
        chainLength: (report.details && report.details.chain) || 0,
        chainStart: report.start || null,
        chainEnd: report.end || null,
        updatedAt: Date.now(),
        syncedBy: syncerName.trim() || null
      };

      setChainSync(next);
      if (dbRef.current) {
        dbRef.current.doc('config/chainSync').set(next).catch(() => {});
      }
      setChainSyncMsg({ type: 'ok', text: `Synced ${attackers.length} attackers, chain length ${next.chainLength}.` });
      setChainPasteText('');
    } catch (e) {
      setChainSyncMsg({ type: 'error', text: e.message || 'Could not parse that as JSON.' });
    }
  };

  // Deduped, sorted list of known member names (from the last roster sync)
  // used to power the autofill dropdown on the name fields.
  const syncedMemberNames = useMemo(() => {
    return Array.from(new Set(Object.values(rosterNames))).sort((a, b) => a.localeCompare(b));
  }, [rosterNames]);

  // Chain-report hits joined to names, keyed by lowercased name so they
  // match against however watchers typed their name into the roster.
  const chainHitsByName = useMemo(() => {
    const map = {};
    chainSync.attackers.forEach(a => {
      const name = rosterNames[String(a.id)] || `#${a.id}`;
      map[name.toLowerCase()] = { hits: a.hits, respect: a.respect, bonusHits: a.bonusHits, id: a.id };
    });
    chainSync.nonAttackerIds.forEach(id => {
      const name = rosterNames[String(id)] || `#${id}`;
      if (!map[name.toLowerCase()]) map[name.toLowerCase()] = { hits: 0, respect: 0, bonusHits: 0, id };
    });
    return map;
  }, [chainSync, rosterNames]);

  // Compute player stats aggregating across all dates (or filtered by statsDayFilter)
  const computePlayerStats = (dayFilter) => {
    const stats = {};

    const datesToInclude = Object.keys(shiftsByDate).filter(dateStr => {
      if (dayFilter === 'all') return true;
      return dateStr === dayFilter;
    });

    datesToInclude.forEach(dateStr => {
      const dayShifts = shiftsByDate[dateStr] || [];

      dayShifts.forEach(shift => {
        if (shift.primaryWatcher) {
          const name = shift.primaryWatcher;
          if (!stats[name]) {
            stats[name] = { 
              name, 
              primaryHours: 0, 
              secondaryHours: 0, 
              primaryCompletedHours: 0, 
              secondaryCompletedHours: 0,
              clockedSlotsSet: new Set()
            };
          }
          stats[name].primaryHours += 1;
          stats[name].clockedSlotsSet.add(`${dateStr}_${shift.hour}`);
          if (shift.primaryCompleted) stats[name].primaryCompletedHours += 1;
        }

        if (shift.secondaryWatcher) {
          const name = shift.secondaryWatcher;
          if (!stats[name]) {
            stats[name] = { 
              name, 
              primaryHours: 0, 
              secondaryHours: 0, 
              primaryCompletedHours: 0, 
              secondaryCompletedHours: 0,
              clockedSlotsSet: new Set()
            };
          }
          stats[name].secondaryHours += 1;
          stats[name].clockedSlotsSet.add(`${dateStr}_${shift.hour}`);
          if (shift.secondaryCompleted) stats[name].secondaryCompletedHours += 1;
        }
      });
    });

    // Make sure everyone who has chain hits shows up even if they aren't
    // currently on the shift roster for the selected day filter.
    Object.entries(chainHitsByName).forEach(([lowerName, hitData]) => {
      const existing = Object.values(stats).find(s => s.name.toLowerCase() === lowerName);
      if (!existing) {
        stats[lowerName] = {
          name: rosterNames[String(hitData.id)] || lowerName,
          primaryHours: 0,
          secondaryHours: 0,
          primaryCompletedHours: 0,
          secondaryCompletedHours: 0,
          clockedSlotsSet: new Set()
        };
      }
    });

    return Object.values(stats).map(p => {
      const hitData = chainHitsByName[p.name.toLowerCase()] || { hits: 0, respect: 0, bonusHits: 0 };

      const totalEventHits = hitData.hits;
      const respectEarned = hitData.respect;
      const bonusHits = hitData.bonusHits;

      const totalHours = p.primaryHours + p.secondaryHours;
      const grossVerifiedPay = (p.primaryCompletedHours * settings.primaryRate) + (p.secondaryCompletedHours * settings.secondaryRate);

      const metEventMin = totalEventHits >= settings.eventMinHits;

      const mascot = '🐾';

      return {
        ...p,
        mascot,
        totalHours,
        totalEventHits,
        respectEarned,
        bonusHits,
        grossVerifiedPay,
        metEventMin
      };
    }).sort((a, b) => b.totalEventHits - a.totalEventHits);
  };

  const playerStats = useMemo(() => computePlayerStats(statsDayFilter),
    [shiftsByDate, chainHitsByName, rosterNames, settings, statsDayFilter]);

  const totalStats = useMemo(() => {
    const totalHitsEvent = playerStats.reduce((acc, p) => acc + p.totalEventHits, 0);
    const totalRespectEarned = playerStats.reduce((acc, p) => acc + p.respectEarned, 0);
    const totalShiftHoursSignedUp = playerStats.reduce((acc, p) => acc + p.totalHours, 0);
    const totalGrossPayout = playerStats.reduce((acc, p) => acc + p.grossVerifiedPay, 0);
    const membersMeetingMin = playerStats.filter(p => p.metEventMin).length;

    return {
      totalHitsEvent,
      totalRespectEarned,
      totalShiftHoursSignedUp,
      totalGrossPayout,
      membersMeetingMin,
      totalMembers: playerStats.length
    };
  }, [playerStats]);

  // Prompt (once per session) when the whole-faction goal is reached, as
  // long as the chain isn't already marked completed.
  useEffect(() => {
    if (
      settings.chainGoal > 0 &&
      totalStats.totalHitsEvent >= settings.chainGoal &&
      settings.chainStatus !== 'completed' &&
      !goalPromptDismissed
    ) {
      setShowGoalPrompt(true);
    }
  }, [totalStats.totalHitsEvent, settings.chainGoal, settings.chainStatus, goalPromptDismissed]);

  const filteredEventPlayers = useMemo(() => {
    return playerStats.filter(p => {
      const matchesSearch = p.name.toLowerCase().includes(searchTerm.toLowerCase());
      if (!matchesSearch) return false;

      if (eventFilter === 'met') return p.metEventMin;
      if (eventFilter === 'below') return !p.metEventMin;
      return true;
    });
  }, [playerStats, searchTerm, eventFilter]);

  // Compute event days list for quick navigation buttons
  const eventDaysList = useMemo(() => {
    const list = [];
    const count = settings.chainDurationDays || 5;
    for (let i = 0; i < count; i++) {
      const dateStr = shiftDateString(settings.chainStartDate, i);
      list.push({
        dayNumber: i + 1,
        dateStr,
        isStartDate: i === 0
      });
    }
    return list;
  }, [settings.chainStartDate, settings.chainDurationDays]);

  const formatMoney = (amount) => {
    return new Intl.NumberFormat('en-US', {
      style: 'currency',
      currency: 'USD',
      maximumFractionDigits: 0
    }).format(amount).replace('$', '$ ');
  };

  const formatTCTTime = (dateObj) => {
    return dateObj.toISOString().substr(11, 8);
  };

  const getFormattedLocalHour = (tctHour, tz) => {
    if (tz === 'UTC') return null;
    try {
      const date = new Date();
      date.setUTCHours(tctHour, 0, 0, 0);
      return new Intl.DateTimeFormat('en-US', {
        timeZone: tz,
        hour: '2-digit',
        minute: '2-digit',
        hour12: false
      }).format(date);
    } catch {
      return null;
    }
  };

  // Formats a shift as a 1-hour block, e.g. "15:00-16:00 TCT" instead of just the start time.
  const getShiftBlockLabel = (tctHour, tz) => {
    const startTCT = `${String(tctHour).padStart(2, '0')}:00`;
    const endTCT = `${String((tctHour + 1) % 24).padStart(2, '0')}:00`;
    const tctLabel = `${startTCT}-${endTCT} TCT`;

    if (tz === 'UTC') return { tctLabel, localLabel: null };

    const startLocal = getFormattedLocalHour(tctHour, tz);
    const endLocal = getFormattedLocalHour((tctHour + 1) % 24, tz);
    const localLabel = (startLocal && endLocal) ? `${startLocal}-${endLocal}` : null;

    return { tctLabel, localLabel };
  };

  const exportEventCSV = () => {
    let csv = "Member,Total Chain Hits,Respect Earned,Bonus Hits,Met Minimum Target,Shift Hours Signed Up,Gross Payout Owed\n";
    playerStats.forEach(p => {
      csv += `"${p.name}",${p.totalEventHits},${p.respectEarned},${p.bonusHits},${p.metEventMin ? 'Yes' : 'No'},${p.totalHours},$${p.grossVerifiedPay}\n`;
    });

    const blob = new Blob([csv], { type: 'text/csv' });
    const url = window.URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = `The_ZOO_NightShift_Event_Hits_Report.csv`;
    a.click();
  };

  // Final chain report — always the whole event regardless of whatever day
  // filter happens to be selected on the Stats tab right now.
  const generateChainEndReport = () => {
    const finalStats = computePlayerStats('all').sort((a, b) => b.totalEventHits - a.totalEventHits);
    const totalHits = finalStats.reduce((acc, p) => acc + p.totalEventHits, 0);
    const totalRespect = finalStats.reduce((acc, p) => acc + p.respectEarned, 0);

    let csv = `The ZOO — Night Shift Chain Report\n`;
    csv += `Generated,${new Date().toLocaleString()}\n`;
    csv += `Chain Goal,${settings.chainGoal}\n`;
    csv += `Total Chain Hits,${totalHits}\n`;
    csv += `Total Respect Earned,${totalRespect}\n`;
    csv += `Chain Length (Torn Sync),${chainSync.chainLength || 0}\n\n`;
    csv += "Member,Total Hits,Respect Earned,Bonus Hits,Primary Hours,Secondary Hours,Total Hours,Met Minimum Target\n";
    finalStats.forEach(p => {
      csv += `"${p.name}",${p.totalEventHits},${p.respectEarned},${p.bonusHits},${p.primaryHours},${p.secondaryHours},${p.totalHours},${p.metEventMin ? 'Yes' : 'No'}\n`;
    });

    const blob = new Blob([csv], { type: 'text/csv' });
    const url = window.URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = `The_ZOO_ChainEndReport_${todayDateStr}.csv`;
    a.click();
    window.URL.revokeObjectURL(url);
  };

  const handleConfirmEndChain = async () => {
    const confirmed = await askConfirm(
      'End the chain now?\n\nThis marks the chain as completed, locks the roster, and downloads a final report ' +
      '(hits, respect, and hours picked up per member). This can be undone later in Roster Settings if needed.'
    );
    if (!confirmed) return;

    generateChainEndReport();
    updateSettings({ chainStatus: 'completed' });
    setShowGoalPrompt(false);
    setGoalPromptDismissed(true);
  };

  const handleResetChain = async () => {
    const confirmed = await askConfirm(
      'Reset the whole app for the next chain?\n\nThis clears every shift day, all notes, the synced chain hits/respect, ' +
      'the roster name cache, and resets the chain status/dates back to defaults. This cannot be undone. Continue?'
    );
    if (!confirmed) return;
    const doubleCheck = await askConfirm('Really sure? This wipes the shared roster for everyone in the faction.');
    if (!doubleCheck) return;

    const db = dbRef.current;
    try {
      if (db) {
        const [liveDocs, archiveDocs] = await Promise.all([
          db.collection('shifts').get(),
          db.collection('shifts_archive').get()
        ]);
        await Promise.all(liveDocs.docs.map(d => db.collection('shifts').doc(d.id).delete().catch(() => {})));
        await Promise.all(archiveDocs.docs.map(d => db.collection('shifts_archive').doc(d.id).delete().catch(() => {})));

        const clearedChainSync = { attackers: [], nonAttackerIds: [], chainLength: 0, chainStart: null, chainEnd: null, updatedAt: null, syncedBy: null };
        await db.doc('config/chainSync').set(clearedChainSync).catch(() => {});
        await db.doc('config/rosterNames').set({ idToName: {} }).catch(() => {});

        const resetSettings = {
          ...settings,
          chainStatus: 'scheduled',
          chainStartDate: formatDateToISO(new Date()),
          leaderOverrideLock: false
        };
        await db.doc('config/settings').set(resetSettings).catch(() => {});
        setSettings(resetSettings);
        setChainSync(clearedChainSync);
        setRosterNames({});
      }

      // Rebuild a fresh, empty local schedule window so the page has
      // something to show immediately without waiting on a re-sync.
      const today = new Date();
      const dayMinus1 = shiftDateString(formatDateToISO(today), -1);
      const day0 = formatDateToISO(today);
      const day1 = shiftDateString(formatDateToISO(today), 1);
      const day2 = shiftDateString(formatDateToISO(today), 2);
      const freshShifts = {
        [dayMinus1]: generateInitialShiftsForDate(dayMinus1),
        [day0]: generateInitialShiftsForDate(day0),
        [day1]: generateInitialShiftsForDate(day1),
        [day2]: generateInitialShiftsForDate(day2)
      };
      setShiftsByDate(freshShifts);
      if (db) {
        await Promise.all(Object.entries(freshShifts).map(([dateStr, shifts]) =>
          db.collection('shifts').doc(dateStr).set({ shifts }).catch(() => {})
        ));
      }

      setGoalPromptDismissed(false);
      setSelectedDate(day0);
      setResetStatus({ type: 'ok', message: 'Chain reset — ready for the next one.' });
    } catch (e) {
      setResetStatus({ type: 'err', message: 'Reset failed: ' + e.message });

                    className="w-full bg-slate-950 border border-slate-800 rounded-xl px-4 py-2.5 text-sm font-mono text-cyan-400"
                  />
                  <p className="text-[10px] text-slate-500 mt-1">Simple hit count target for each member</p>
                </div>

                <div>
                  <label className="block text-xs font-extrabold uppercase text-emerald-400 mb-1.5">
                    Primary Watcher Pay ($ / hr)
                  </label>
                  <input
                    type="number"
                    value={settings.primaryRate}
                    onChange={(e) => updateSettings({ primaryRate: Number(e.target.value) })}
                    className="w-full bg-slate-950 border border-slate-800 rounded-xl px-4 py-2.5 text-sm font-mono text-emerald-400"
                  />
                </div>

                <div>
                  <label className="block text-xs font-extrabold uppercase text-cyan-400 mb-1.5">
                    Secondary Watcher Pay ($ / hr)
                  </label>
                  <input
                    type="number"
                    value={settings.secondaryRate}
                    onChange={(e) => updateSettings({ secondaryRate: Number(e.target.value) })}
                    className="w-full bg-slate-950 border border-slate-800 rounded-xl px-4 py-2.5 text-sm font-mono text-cyan-400"
                  />
                </div>
              </div>

            </div>

            {/* DANGER ZONE: Reset Chain */}
            <div className="bg-black/80 border border-rose-500/50 rounded-2xl p-6 shadow-2xl">
              <h2 className="text-lg font-extrabold text-rose-300 flex items-center gap-2 border-b border-rose-900/60 pb-4 mb-4">
                <AlertTriangle className="w-5 h-5 text-rose-400" /> Reset Chain (Danger Zone)
              </h2>
              <p className="text-xs text-slate-400 mb-4 leading-relaxed">
                Wipes every shift day (current and archived), all shift notes, the synced Torn chain hits/respect,
                and the roster name cache — then rebuilds a fresh empty schedule starting today. Chain status resets
                to "Scheduled" and the start date resets to today. Use this once a chain is fully wrapped up and
                reported on, to get the app ready for the next one. This cannot be undone.
              </p>
              <button
                onClick={handleResetChain}
                className="px-4 py-2.5 rounded-xl bg-rose-700 hover:bg-rose-600 text-sm font-extrabold text-white transition"
              >
                Reset Chain
              </button>
              {resetStatus && (
                <p className={`text-xs font-bold mt-3 ${resetStatus.type === 'err' ? 'text-red-400' : 'text-emerald-400'}`}>
                  {resetStatus.message}
                </p>
              )}
            </div>

          </div>
        )}

      </main>
    </div>
  );
}

const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(<App />);
</script>
</body>
</html>
